<h2>Password Reset Request</h2>
<p>Use the one-time code below to reset your password. It is valid for <strong>{{ttlMinutes}} minutes</strong>.</p>

<div class="code-box">
    <span class="code">{{otp}}</span>
</div>

{{#if ipAddress}}
<div class="info-box">
    <strong>Request IP:</strong> {{ipAddress}}<br>
    {{#if userAgent}}<strong>Device:</strong> {{userAgent}}{{/if}}
</div>
{{/if}}

<hr class="divider">

<p class="muted">If you did not request this, you can safely ignore this email.</p>
