<h2>Response to Your Support Ticket</h2>
<p>Our support team has responded to your ticket.</p>

<div class="info-box">
    <strong>Ticket ID:</strong> #{{ticketId}}<br>
    <strong>Subject:</strong> {{subject}}
</div>

<div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #007bff;">
    <p style="margin: 0; white-space: pre-wrap;">{{responseText}}</p>
</div>

<p style="text-align: center; margin: 30px 0;">
    <a href="{{frontendUrl}}/support/{{ticketId}}" class="btn">View Full Conversation</a>
</p>
