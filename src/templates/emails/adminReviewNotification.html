<h2>Company Submitted for Review</h2>
<p>A company has been submitted/resubmitted for review.</p>

<div class="info-box">
    <strong>Company ID:</strong> {{companyId}}<br>
    <strong>Company Name:</strong> {{companyName}}<br>
    <strong>Agent ID:</strong> {{agentId}}<br>
    {{#if agentEmail}}<strong>Agent Email:</strong> {{agentEmail}}{{/if}}
</div>

<p style="text-align: center; margin: 30px 0;">
    <a href="{{frontendUrl}}/admin/companies/{{companyId}}" class="btn">Review Company</a>
</p>
