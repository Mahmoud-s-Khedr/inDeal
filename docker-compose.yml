services:
  # ============================================
  # API - Development
  # ============================================
  api:
    build:
      context: .
      target: development
    container_name: indeal_api
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 3000
      ENABLE_SOCKETIO: 'true'
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-indeal}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    volumes:
      # Bind mount for live reload during development
      - .:/usr/src/app
      # Anonymous volume to preserve node_modules from container
      - /usr/src/app/node_modules
    command: sh scripts/dev-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - indeal_network

  # ============================================
  # API - Production
  # ============================================
  api-prod:
    build:
      context: .
      target: production
    container_name: indeal_api_prod
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      ENABLE_SOCKETIO: 'true'
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-indeal}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: always
    networks:
      - indeal_network
    profiles: ['prod']

  # ============================================
  # API - Tests
  # ============================================
  api-tests:
    build:
      context: .
      target: development
    container_name: indeal_api_tests
    command: sh -c "npm install && npm test"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: test
      ENABLE_SOCKETIO: 'true'
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-indeal}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - indeal_network
    profiles: ['test']

  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: indeal_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-indeal}
    ports:
      - '127.0.0.1:${HOST_DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-indeal}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indeal_network

  # ============================================
  # Valkey (Redis-compatible cache)
  # ============================================
  valkey:
    image: valkey/valkey:alpine
    container_name: indeal_valkey
    restart: always
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indeal_network

# ============================================
# Networks
# ============================================
networks:
  indeal_network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  valkey_data:
