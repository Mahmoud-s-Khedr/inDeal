version: '3.8'

services:
  api:
    build:
      context: .
      args:
        NODE_ENV: development
    container_name: indeal_api
    command: npm run dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-indeal}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  api-tests:
    build:
      context: .
      args:
        NODE_ENV: test
    container_name: indeal_api_tests
    command: npm test
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-indeal}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    profiles: ["test"]

  db:
    image: postgres:16-alpine
    container_name: indeal_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-indeal}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-indeal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:alpine
    container_name: indeal_valkey
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
